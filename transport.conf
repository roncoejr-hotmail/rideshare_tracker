# Reverse proxy for transportation-history.miosys.org: TLS termination + pass-through
# to the transport ledger API on the internal network. Mirrors grocery.conf.
limit_req_zone $binary_remote_addr zone=transport:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name transportation-history.miosys.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name transportation-history.miosys.org;

    ssl_certificate     /etc/letsencrypt/live/transportation-history.miosys.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/transportation-history.miosys.org/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security max-age=63072000 always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    server_tokens off;

    location = /health {
        set $transport_api http://transport-api:8080;
        proxy_pass $transport_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=transport burst=20 nodelay;
        set $transport_api http://transport-api:8080;
        proxy_pass $transport_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
